<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 45 280 145" role="img" aria-labelledby="title">
  <title id="title">Running rat, adapted from the supplied SVG Repo silhouette</title>
  <style>
    .body{animation:bound .44s ease-in-out infinite;transform-origin:130px 125px}
    .limb{animation:stride .44s ease-in-out infinite;transform-origin:0 0;animation-delay:var(--phase)}
    .shin{animation:flex .44s ease-in-out infinite;transform-origin:0 0;animation-delay:var(--phase)}
    .tail{animation:tail .44s ease-in-out infinite;transform-origin:48px 137px}
    .far{fill:#77766f}.near,.body{fill:#c7c5bb}.paused *{animation-play-state:paused!important}
    @keyframes bound{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-3px) rotate(1deg)}}
    @keyframes stride{0%,100%{transform:rotate(-30deg)}28%{transform:rotate(30deg)}53%{transform:rotate(37deg)}78%{transform:rotate(-12deg)}}
    @keyframes flex{0%,100%{transform:rotate(30deg)}28%{transform:rotate(-12deg)}53%{transform:rotate(-42deg)}78%{transform:rotate(-18deg)}}
    @keyframes tail{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g transform="translate(278 0) scale(-1 1)">
