<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="rat-face-title">
  <title id="rat-face-title">Rat face with gently moving whiskers, inspired by the supplied rat silhouette</title>
  <style>
    .whiskers { fill:none; stroke:#b7b5aa; stroke-width:2.7; stroke-linecap:round; }
    .whiskers-left { transform-origin:322px 316px; animation:whisk-left 2.8s ease-in-out infinite; }
    .whiskers-right { transform-origin:398px 316px; animation:whisk-right 3.2s ease-in-out -.7s infinite; }
    .paused * { animation-play-state:paused!important; }
    @keyframes whisk-left { 0%,100% { transform:rotate(-3deg); } 50% { transform:rotate(4deg); } }
    @keyframes whisk-right { 0%,100% { transform:rotate(3deg); } 50% { transform:rotate(-4deg); } }
    @media(prefers-reduced-motion:reduce) { * { animation:none!important; } }
  </style>
  <defs>
    <path id="face-ear" d="M259 109C267 65 250 22 213 17C171 10 136 40 135 81C133 121 163 153 209 162Z"/>
    <path id="face-ear-inner" d="M237 112C245 79 233 43 209 40C181 37 158 58 158 84C158 110 178 133 210 138Z"/>
  </defs>
  <g fill="#b6b4aa" stroke="#151513" stroke-width="3" stroke-linejoin="round">
    <use href="#face-ear"/>
    <use href="#face-ear" transform="translate(720 0) scale(-1 1)"/>
  </g>
  <g fill="#484842">
    <use href="#face-ear-inner"/>
    <use href="#face-ear-inner" transform="translate(720 0) scale(-1 1)"/>
  </g>
