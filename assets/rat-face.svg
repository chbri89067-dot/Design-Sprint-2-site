  <g fill="none" stroke="#77766f" stroke-width="2" stroke-linecap="round">
    <path d="M307 110Q335 92 347 92M413 110Q385 92 373 92"/>
    <path d="M231 224L243 232M237 245L252 252M489 224L477 232M483 245L468 252"/>
    <path d="M289 224Q307 240 312 257M431 224Q413 240 408 257"/>
  </g>
  <g fill="#111110">
    <ellipse cx="276" cy="190" rx="16" ry="21" transform="rotate(-17 276 190)"/>
    <ellipse cx="444" cy="190" rx="16" ry="21" transform="rotate(17 444 190)"/>
  </g>
  <g fill="#efede5"><circle cx="271" cy="183" r="4"/><circle cx="439" cy="183" r="4"/></g>
